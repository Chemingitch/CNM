name: 发布

# 推一个 v* 的标签就自动出包；也可以在 Actions 页面手动跑一次（只上传构建产物，不发 Release）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 让程序版本号和 tag 对齐（v0.2.0 → 0.2.0）
      - name: 版本号对齐 tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $csproj = 'CNM.csproj'
          $t = [IO.File]::ReadAllText($csproj, [Text.Encoding]::UTF8)
          $t = [Text.RegularExpressions.Regex]::Replace($t, '<Version>[^<]*</Version>', "<Version>$v</Version>")
          [IO.File]::WriteAllText($csproj, $t, (New-Object System.Text.UTF8Encoding($false)))
          $iss = 'installer\CNM.iss'
          $i = [IO.File]::ReadAllText($iss, [Text.Encoding]::UTF8)
          $i = [Text.RegularExpressions.Regex]::Replace($i, '#define\s+AppVer\s+"[^"]*"', "#define AppVer `"$v`"")
          [IO.File]::WriteAllText($iss, $i, (New-Object System.Text.UTF8Encoding($true)))
          Write-Host "版本号 → $v"

      # 自包含发布（自带 .NET 运行时，换机器直接跑）
      - name: 构建
        shell: pwsh
        run: ./build.ps1

      # 引擎不进仓库（80+ MB 二进制），CI 里现装：官方最新 Vulkan 版
      # 两个坑（0.1.3 第一次发版就踩了，整条流水线还全绿）：
      #   ① 匿名查 api.github.com 会被限流（403 rate limit）→ 带上 Actions 自带的只读令牌；
      #   ② 装失败了也必须让这一步红掉 —— 否则会打出一个「名叫完整、其实和精简包一模一样」的包。
      - name: 装推理引擎
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for ($i = 1; $i -le 3; $i++) {
            ./dist/CNM/CNM.exe --install-engine vulkan --engine-token $env:GITHUB_TOKEN
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "::warning::第 $i 次装引擎失败（退出码 $LASTEXITCODE），10 秒后重试"
            Start-Sleep -Seconds 10
          }
          if ($LASTEXITCODE -ne 0) { throw "装引擎失败（退出码 $LASTEXITCODE）——完整版便携包必须有引擎" }
          $srv = 'dist/CNM/engine/llama/llama-server.exe'
          if (-not (Test-Path $srv)) { throw "引擎装完却没看到 $srv" }
          $f = Get-Item $srv
          Write-Host ("引擎就位：{0}（{1:N1} MB）" -f $f.FullName, ($f.Length / 1MB))

      - name: 打便携包（完整 + 精简）
        shell: pwsh
        run: |
          ./deploy/portable.ps1 -SkipBuild
          ./deploy/portable.ps1 -SkipBuild -NoEngine

      # 安装包：CI 上没有本机那个汉化版 Inno，就装官方版；失败也不影响便携包发布，
      # 但要在日志里明说（0.1.3 第一次发版就是引擎缺失 → 安装包编译中止 → 悄悄只剩便携包）
      - name: 编译安装包（尽力而为）
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          ./installer/build.ps1

      - name: 自检（产物齐不齐）
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -File -Filter 'CNM-Setup-*.exe' -ErrorAction SilentlyContinue
          if (-not $setup) { Write-Host '::warning::没生成安装包 —— Release 里将只有便携包（看上一段的 ISCC 报错）' }
          else { Write-Host ("安装包就位：{0}（{1:N1} MB）" -f $setup.Name, ($setup.Length / 1MB)) }
          Get-ChildItem dist -File | Where-Object { $_.Name -match '^CNM-' } | ForEach-Object {
            Write-Host ("  {0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB))
          }

      - name: 生成 SHA256 校验和
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '^CNM-(Portable|Setup)-' } | Sort-Object Name
          if ($files) {
            $lines = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
            [IO.File]::WriteAllLines('dist/SHA256SUMS.txt', $lines, (New-Object System.Text.UTF8Encoding($false)))
            $lines | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host '（没有可校验的产物）'
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cnm-${{ github.ref_name }}
          path: |
            dist/CNM-Portable-*.zip
            dist/CNM-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: warn

      - name: 发 Release（只有推 tag 才发）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CNM-Portable-*.zip
            dist/CNM-Setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
